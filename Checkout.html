<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Baby Store</title>

        <link rel="icon" type="image/png" href="Images/Favicon.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&family=Sriracha&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="CSS/Style.css"
    >

</head>


<body class="checkout-page">


    <!-- =====================================================
         CHECKOUT HEADER
    ====================================================== -->

    <header class="checkout-header">

        <div class="container">

            <a href="index.html" class="checkout-logo">

                <span>Baby</span><strong>Ku</strong>

            </a>

        </div>

    </header>



    <!-- =====================================================
         CHECKOUT MAIN
    ====================================================== -->

    <main class="checkout-main">

        <div class="container">

            <div class="row g-0">


                <!-- =================================================
                     LEFT SIDE
                ================================================== -->

                <div class="col-lg-7 checkout-left">

                    <!-- CONTACT -->

                    <section class="checkout-section">

                        <h2>
                            Contact
                        </h2>

                        <input
                            type="email"
                            class="checkout-input"
                            placeholder="Email Address"
                            required
                        >

                    </section>



                    <!-- BILLING DETAILS -->

                    <section class="checkout-section">

                        <h2>
                            Billing Details
                        </h2>


                        <div class="row g-3">

                            <div class="col-md-6">

                                <input
                                    type="text"
                                    class="checkout-input"
                                    placeholder="First name"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <input
                                    type="text"
                                    class="checkout-input"
                                    placeholder="Last name"
                                    required
                                >

                            </div>


                            <div class="col-12">

                                <select
                                    class="checkout-input"
                                    required
                                >

                                    <option value="">
                                        Country / Region
                                    </option>

                                    <option selected>
                                        India
                                    </option>

                                    <option>
                                        United States
                                    </option>

                                    <option>
                                        United Kingdom
                                    </option>

                                </select>

                            </div>


                            <div class="col-12">

                                <input
                                    type="text"
                                    class="checkout-input"
                                    placeholder="Street address"
                                    required
                                >

                            </div>


                            <div class="col-12">

                                <input
                                    type="text"
                                    class="checkout-input"
                                    placeholder="Apartment, suite, unit, etc. (optional)"
                                >

                            </div>


                            <div class="col-md-4">

                                <input
                                    type="text"
                                    class="checkout-input"
                                    placeholder="Town / City"
                                    required
                                >

                            </div>


                            <div class="col-md-4">

                                <select
                                    class="checkout-input"
                                    required
                                >

                                    <option value="">
                                        State
                                    </option>

                                    <option>
                                        Madhya Pradesh
                                    </option>

                                    <option>
                                        Maharashtra
                                    </option>

                                    <option>
                                        Rajasthan
                                    </option>

                                    <option>
                                        Gujarat
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-4">

                                <input
                                    type="text"
                                    class="checkout-input"
                                    placeholder="PIN Code"
                                    required
                                >

                            </div>


                            <div class="col-12">

                                <input
                                    type="tel"
                                    class="checkout-input"
                                    placeholder="Phone"
                                    required
                                >

                            </div>

                        </div>

                    </section>



                    <!-- ADDITIONAL INFORMATION -->

                    <section class="checkout-section">

                        <h2>
                            Additional Information
                        </h2>

                        <textarea
                            class="checkout-input checkout-textarea"
                            placeholder="Notes about your order, e.g. special notes for delivery."
                        ></textarea>

                    </section>



                    <!-- PAYMENT -->

                    <section class="checkout-section checkout-payment">

                        <h2>
                            Payment
                        </h2>


                        <div class="payment-message">

                            <i class="bi bi-square"></i>

                            <span>
                                Sorry, it seems that there are no available payment methods for your state.
                                Please contact us if you require assistance or wish to make alternate arrangements.
                            </span>

                        </div>


                        <button
                            type="button"
                            class="place-order-button"
                            id="placeOrderButton"
                        >

                            <i class="bi bi-lock-fill"></i>

                            Place Order

                            <span id="placeOrderTotal">
                                $0.00
                            </span>

                        </button>

                    </section>

                </div>



                <!-- =================================================
                     RIGHT SIDE
                ================================================== -->

                <div class="col-lg-5 checkout-right">

                    <div class="checkout-order">


                        <!-- ORDER PRODUCTS -->

                        <div
                            id="checkoutProducts"
                            class="checkout-products"
                        >
                            <!-- Products will come from localStorage -->
                        </div>



                        <!-- COUPON -->

                        <div class="checkout-coupon">

                            <input
                                type="text"
                                id="couponCode"
                                placeholder="Coupon Code"
                            >

                            <button
                                type="button"
                                id="applyCoupon"
                            >
                                Apply
                            </button>

                        </div>



                        <!-- SUBTOTAL -->

                        <div class="checkout-total-row">

                            <span>
                                Subtotal
                            </span>

                            <span id="checkoutSubtotal">
                                $0.00
                            </span>

                        </div>



                        <!-- TOTAL -->

                        <div class="checkout-total-main">

                            <span>
                                Total
                            </span>

                            <span id="checkoutTotal">
                                $0.00
                            </span>

                        </div>


                    </div>

                </div>


            </div>

        </div>

    </main>



    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- MAIN SCRIPT -->

    <script src="JS/Script.js"></script>

</body>

</html>
